ato = N2</text><text x="1189" y="1550" text-anchor="middle" font-weight="bold">No</text><text x="1739" y="1550" text-anchor="middle" font-weight="bold">Sí</text><rect x="1764" y="1693" width="300" height="70" fill="white" stroke="#173849" stroke-width="2.5"/><text x="1914" y="1735" text-anchor="middle" >pos2 ← posicion</text><rect x="1314" y="1903" width="300" height="70" fill="white" stroke="#173849" stroke-width="2.5"/><text x="1464" y="1945" text-anchor="middle" >↑A ← ↑A.PS</text><circle cx="1464" cy="2020" r="22" fill="white" stroke="#173849" stroke-width="2.5"/><text x="1464" y="2027" text-anchor="middle" >1</text><path d="M844,2178 L1104,2258 L844,2338 L584,2258 Z" fill="white" stroke="#173849" stroke-width="2.5"/><text x="844" y="2265" text-anchor="middle" >pos1 &lt;&gt; 0 Y pos2 &lt;&gt; 0</text><text x="569" y="2250" text-anchor="middle" font-weight="bold">No</text><text x="1119" y="2250" text-anchor="middle" font-weight="bold">Sí</text><path d="M90,2393 H544 V2455 Q430.5,2443 317,2455 T90,2455 Z" fill="white" stroke="#173849" stroke-width="2.5"/><text x="317" y="2435" text-anchor="middle" >“Uno o ambos números no existen”</text><path d="M2808,2393 L3068,2473 L2808,2553 L2548,2473 Z" fill="white" stroke="#173849" stroke-width="2.5"/><text x="2808" y="2480" text-anchor="middle" >pos1 = pos2</text><text x="2533" y="2465" text-anchor="middle" font-weight="bold">No</text><text x="3083" y="2465" text-anchor="middle" font-weight="bold">Sí</text><path d="M1826,2608 L2086,2688 L1826,2768 L1566,2688 Z" fill="white" stroke="#173849" stroke-width="2.5"/><text x="1826" y="2695" text-anchor="middle" >pos1 &lt; pos2</text><text x="1551" y="2680" text-anchor="middle" font-weight="bold">No</text><text x="2101" y="2680" text-anchor="middle" font-weight="bold">Sí</text><rect x="1144" y="2823" width="382" height="70" fill="white" stroke="#173849" stroke-width="2.5"/><text x="1335" y="2865" text-anchor="middle" >cantidad ← pos1 - pos2 - 1</text><rect x="2126" y="2823" width="3