<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="782" viewBox="0 0 1600 782"><title>ejercicio-02</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="80" y="66" font-size="30" font-weight="bold" fill="#103a4a">Unidad 2 propuesta — Ejercicio 2: Notas de crédito y débito</text><text x="80" y="112" font-size="24" font-weight="normal" fill="#172b36">Ejemplo didáctico original, creado para estudiar; no es un enunciado de la profesora.</text><text x="80" y="178" font-size="25" font-weight="bold" fill="#103a4a">Enunciado</text><text x="80" y="224" font-size="24" font-weight="normal" fill="#172b36">Una factura por 1.000 se reduce en 200 por una devolución y luego se suma un cargo acordado de 50. Indicá los documentos</text><text x="80" y="258" font-size="24" font-weight="normal" fill="#172b36">conceptuales y calculá el saldo.</text><text x="80" y="324" font-size="25" font-weight="bold" fill="#103a4a">Datos y supuestos</text><text x="80" y="370" font-size="24" font-weight="normal" fill="#172b36">Valores ilustrativos; sin impuestos ni otros cargos. La devolución y el cargo fueron aceptados.</text><text x="80" y="436" font-size="25" font-weight="bold" fill="#103a4a">Resolución paso a paso</text><text x="80" y="482" font-size="24" font-weight="normal" fill="#172b36">1. La devolución reduce el saldo mediante una nota de crédito comercial: 1.000 − 200 = 800.</text><text x="80" y="528" font-size="24" font-weight="normal" fill="#172b36">2. El cargo adicional aumenta el saldo mediante una nota de débito: 800 + 50 = 850.</text><text x="80" y="574" font-size="24" font-weight="normal" fill="#172b36">3. Control directo: 1.000 − 200 + 50 = 850.</text><text x="80" y="640" font-size="25" font-weight="bold" fill="#103a4a">Resultado</text><text x="80" y="686" font-size="24" font-weight="normal" fill="#172b36">Saldo resultante: 850.</text></g></svg>