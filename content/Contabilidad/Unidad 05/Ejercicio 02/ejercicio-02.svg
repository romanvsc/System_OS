<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="841" viewBox="0 0 1410 841"><title>ejercicio-02</title><rect width="100%" height="100%" fill="white"/><g font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><text x="40" y="93" font-size="30" font-weight="bold" fill="#103a4a">Unidad 5 — Ejercicio 2: Compra con pago parcial</text><text x="40" y="119" font-size="18" fill="#172b36">Ejemplo didáctico original, creado para estudiar; no es un enunciado de la profesora.</text><text x="40" y="173" font-size="24" font-weight="bold" fill="#103a4a">Enunciado</text><text x="40" y="199" font-size="18" fill="#172b36">Una empresa comienza con un aporte en efectivo de 5.000 y compra mercaderías por 4.000: paga 1.000 al contado y queda debiendo 3.000.</text><text x="40" y="225" font-size="18" fill="#172b36">Registrá y calculá el patrimonio final.</text><text x="40" y="279" font-size="24" font-weight="bold" fill="#103a4a">Datos y supuestos</text><text x="40" y="305" font-size="18" fill="#172b36">Empresa nueva; valores ilustrativos; sin impuestos, intereses, costos adicionales ni otras operaciones.</text><text x="40" y="359" font-size="24" font-weight="bold" fill="#103a4a">Resolución paso a paso</text><text x="40" y="385" font-size="18" font-weight="bold" fill="#172b36">Operación y cuenta        │ Debe  │ Haber</text><text x="40" y="411" font-size="18" fill="#172b36">──────────────────────────┼───────┼──────</text><text x="40" y="437" font-size="18" fill="#172b36">1. Caja                   │ 5.000 │ —    </text><text x="40" y="463" font-size="18" fill="#172b36">1. Capital                │ —     │ 5.000</text><text x="40" y="489" font-size="18" fill="#172b36">2. Mercaderías            │ 4.000 │ —    </text><text x="40" y="515" font-size="18" fill="#172b36">2. Caja                   │ —     │ 1.000</text><text x="40" y="541" font-size="18" fill="#172b36">2. Proveedores            │ —     │ 3.000</text><text x="40" y="567" font-size="18" fill="#172b36">Total de los dos asientos │ 9.000 │ 9.000</text><text x="40" y="603" font-size="18" fill="#172b36">1. El primer asiento equilibra por 5.000. El segundo: 4.000 = 1.000 + 3.000.</text><text x="40" y="639" font-size="18" fill="#172b36">2. Caja final: 5.000 − 1.000 = 4.000. Mercaderías: 4.000. Activo total: 8.000.</text><text x="40" y="675" font-size="18" fill="#172b36">3. Pasivo con proveedores: 3.000. Patrimonio neto por el aporte: 5.000.</text><text x="40" y="711" font-size="18" fill="#172b36">4. Control: 8.000 = 3.000 + 5.000.</text><text x="40" y="765" font-size="24" font-weight="bold" fill="#103a4a">Resultado</text><text x="40" y="791" font-size="18" fill="#172b36">Activo 8.000; pasivo 3.000; patrimonio neto 5.000.</text></g></svg>