<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1181" viewBox="0 0 1600 1181"><title>ejercicio-02</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="80" y="66" font-size="30" font-weight="bold" fill="#103a4a">Unidad 5 propuesta — Ejercicio 2: Compra con pago parcial</text><text x="80" y="112" font-size="24" font-weight="normal" fill="#172b36">Ejemplo didáctico original, creado para estudiar; no es un enunciado de la profesora.</text><text x="80" y="178" font-size="25" font-weight="bold" fill="#103a4a">Enunciado</text><text x="80" y="224" font-size="24" font-weight="normal" fill="#172b36">Una empresa comienza con un aporte en efectivo de 5.000 y compra mercaderías por 4.000: paga 1.000 al contado y queda debiendo</text><text x="80" y="258" font-size="24" font-weight="normal" fill="#172b36">3.000. Registrá y calculá el patrimonio final.</text><text x="80" y="324" font-size="25" font-weight="bold" fill="#103a4a">Datos y supuestos</text><text x="80" y="370" font-size="24" font-weight="normal" fill="#172b36">Empresa nueva; valores ilustrativos; sin impuestos, intereses, costos adicionales ni otras operaciones.</text><text x="80" y="436" font-size="25" font-weight="bold" fill="#103a4a">Resolución paso a paso</text><rect x="80" y="456" width="496.95" height="48" fill="#e7eff2"/><line x1="80" y1="504" x2="576.95" y2="504" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="488" font-size="22" font-weight="bold" fill="#172b36">Operación y cuenta</text><text x="391" y="488" font-size="22" font-weight="bold" fill="#172b36">Debe</text><text x="486" y="488" font-size="22" font-weight="bold" fill="#172b36">Haber</text><line x1="80" y1="552" x2="576.95" y2="552" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="536" font-size="22" font-weight="normal" fill="#172b36">1. Caja</text><text x="391" y="536" font-size="22" font-weight="normal" fill="#172b36">5.000</text><text x="486" y="536" font-size="22" font-weight="normal" fill="#172b36">—</text><line x1="80" y1="600" x2="576.95" y2="600" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="584" font-size="22" font-weight="normal" fill="#172b36">1. Capital</text><text x="391" y="584" font-size="22" font-weight="normal" fill="#172b36">—</text><text x="486" y="584" font-size="22" font-weight="normal" fill="#172b36">5.000</text><line x1="80" y1="648" x2="576.95" y2="648" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="632" font-size="22" font-weight="normal" fill="#172b36">2. Mercaderías</text><text x="391" y="632" font-size="22" font-weight="normal" fill="#172b36">4.000</text><text x="486" y="632" font-size="22" font-weight="normal" fill="#172b36">—</text><line x1="80" y1="696" x2="576.95" y2="696" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="680" font-size="22" font-weight="normal" fill="#172b36">2. Caja</text><text x="391" y="680" font-size="22" font-weight="normal" fill="#172b36">—</text><text x="486" y="680" font-size="22" font-weight="normal" fill="#172b36">1.000</text><line x1="80" y1="744" x2="576.95" y2="744" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="728" font-size="22" font-weight="normal" fill="#172b36">2. Proveedores</text><text x="391" y="728" font-size="22" font-weight="normal" fill="#172b36">—</text><text x="486" y="728" font-size="22" font-weight="normal" fill="#172b36">3.000</text><line x1="80" y1="792" x2="576.95" y2="792" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="776" font-size="22" font-weight="normal" fill="#172b36">Total de los dos asientos</text><text x="391" y="776" font-size="22" font-weight="normal" fill="#172b36">9.000</text><text x="486" y="776" font-size="22" font-weight="normal" fill="#172b36">9.000</text><text x="80" y="835" font-size="24" font-weight="normal" fill="#172b36">1. El primer asiento equilibra por 5.000. El segundo: 4.000 = 1.000 + 3.000.</text><text x="80" y="881" font-size="24" font-weight="normal" fill="#172b36">2. Caja final: 5.000 − 1.000 = 4.000. Mercaderías: 4.000. Activo total: 8.000.</text><text x="80" y="927" font-size="24" font-weight="normal" fill="#172b36">3. Pasivo con proveedores: 3.000. Patrimonio neto por el aporte: 5.000.</text><text x="80" y="973" font-size="24" font-weight="normal" fill="#172b36">4. Control: 8.000 = 3.000 + 5.000.</text><text x="80" y="1039" font-size="25" font-weight="bold" fill="#103a4a">Resultado</text><text x="80" y="1085" font-size="24" font-weight="normal" fill="#172b36">Activo 8.000; pasivo 3.000; patrimonio neto 5.000.</text></g></svg>