<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="805" viewBox="0 0 1480 805"><title>ejercicio-03</title><rect width="100%" height="100%" fill="white"/><g font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><text x="40" y="93" font-size="30" font-weight="bold" fill="#103a4a">Unidad 5 — Ejercicio 3: Gasto devengado y pago parcial</text><text x="40" y="119" font-size="18" fill="#172b36">Ejemplo didáctico original, creado para estudiar; no es un enunciado de la profesora.</text><text x="40" y="173" font-size="24" font-weight="bold" fill="#103a4a">Enunciado</text><text x="40" y="199" font-size="18" fill="#172b36">Se devenga el alquiler del mes por $600 y queda pendiente de pago. Más tarde se pagan $200 en efectivo. Registrá ambas operaciones y calculá</text><text x="40" y="225" font-size="18" fill="#172b36">la deuda restante.</text><text x="40" y="279" font-size="24" font-weight="bold" fill="#103a4a">Datos y supuestos</text><text x="40" y="305" font-size="18" fill="#172b36">Sin impuestos ni intereses. El manual no tiene una cuenta «Alquileres a pagar»; la deuda por una compra que no es de mercaderías, en c/c sin</text><text x="40" y="331" font-size="18" fill="#172b36">documentar, va a Acreedores varios.</text><text x="40" y="385" font-size="24" font-weight="bold" fill="#103a4a">Resolución paso a paso</text><text x="40" y="411" font-size="18" font-weight="bold" fill="#172b36">Asiento │ Cuenta              │ Debe │ Haber</text><text x="40" y="437" font-size="18" fill="#172b36">────────┼─────────────────────┼──────┼──────</text><text x="40" y="463" font-size="18" fill="#172b36">1       │ Alquileres perdidos │ 600  │      </text><text x="40" y="489" font-size="18" fill="#172b36">        │ a Acreedores varios │      │ 600  </text><text x="40" y="515" font-size="18" fill="#172b36">2       │ Acreedores varios   │ 200  │      </text><text x="40" y="541" font-size="18" fill="#172b36">        │ a Caja              │      │ 200  </text><text x="40" y="567" font-size="18" fill="#172b36">        │ Totales             │ 800  │ 800  </text><text x="40" y="603" font-size="18" fill="#172b36">1. El asiento 1 reconoce la pérdida (devengado) y la deuda por 600.</text><text x="40" y="639" font-size="18" fill="#172b36">2. El asiento 2 baja la deuda y la caja en 200; no vuelve a registrar el gasto.</text><text x="40" y="675" font-size="18" fill="#172b36">3. Mayor de Acreedores varios: Haber 600 − Debe 200 = saldo acreedor 400.</text><text x="40" y="729" font-size="24" font-weight="bold" fill="#103a4a">Resultado</text><text x="40" y="755" font-size="18" fill="#172b36">Deuda restante: 400. Pérdida por alquiler del período: 600.</text></g></svg>