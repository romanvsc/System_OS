<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1167" viewBox="0 0 1600 1167"><title>ejercicio-03</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="80" y="66" font-size="30" font-weight="bold" fill="#103a4a">Unidad 5 propuesta — Ejercicio 3: Gasto devengado y pago parcial</text><text x="80" y="112" font-size="24" font-weight="normal" fill="#172b36">Ejemplo didáctico original, creado para estudiar; no es un enunciado de la profesora.</text><text x="80" y="178" font-size="25" font-weight="bold" fill="#103a4a">Enunciado</text><text x="80" y="224" font-size="24" font-weight="normal" fill="#172b36">Se devenga un alquiler de 600 y queda pendiente de pago. Más tarde se pagan 200. Registrá ambas operaciones y calculá la deuda</text><text x="80" y="258" font-size="24" font-weight="normal" fill="#172b36">restante.</text><text x="80" y="324" font-size="25" font-weight="bold" fill="#103a4a">Datos y supuestos</text><text x="80" y="370" font-size="24" font-weight="normal" fill="#172b36">Importes ilustrativos; el alquiler completo corresponde al período; no hay impuestos, intereses ni otros pagos. La empresa dispone de</text><text x="80" y="404" font-size="24" font-weight="normal" fill="#172b36">efectivo suficiente.</text><text x="80" y="470" font-size="25" font-weight="bold" fill="#103a4a">Resolución paso a paso</text><rect x="80" y="490" width="495.95" height="48" fill="#e7eff2"/><line x1="80" y1="538" x2="575.95" y2="538" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="522" font-size="22" font-weight="bold" fill="#172b36">Operación y cuenta</text><text x="391" y="522" font-size="22" font-weight="bold" fill="#172b36">Debe</text><text x="485" y="522" font-size="22" font-weight="bold" fill="#172b36">Haber</text><line x1="80" y1="586" x2="575.95" y2="586" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="570" font-size="22" font-weight="normal" fill="#172b36">1. Alquileres perdidos</text><text x="391" y="570" font-size="22" font-weight="normal" fill="#172b36">600</text><text x="485" y="570" font-size="22" font-weight="normal" fill="#172b36">—</text><line x1="80" y1="634" x2="575.95" y2="634" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="618" font-size="22" font-weight="normal" fill="#172b36">1. Alquileres a pagar</text><text x="391" y="618" font-size="22" font-weight="normal" fill="#172b36">—</text><text x="485" y="618" font-size="22" font-weight="normal" fill="#172b36">600</text><line x1="80" y1="682" x2="575.95" y2="682" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="666" font-size="22" font-weight="normal" fill="#172b36">2. Alquileres a pagar</text><text x="391" y="666" font-size="22" font-weight="normal" fill="#172b36">200</text><text x="485" y="666" font-size="22" font-weight="normal" fill="#172b36">—</text><line x1="80" y1="730" x2="575.95" y2="730" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="714" font-size="22" font-weight="normal" fill="#172b36">2. Caja</text><text x="391" y="714" font-size="22" font-weight="normal" fill="#172b36">—</text><text x="485" y="714" font-size="22" font-weight="normal" fill="#172b36">200</text><line x1="80" y1="778" x2="575.95" y2="778" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="762" font-size="22" font-weight="normal" fill="#172b36">Total de los dos asientos</text><text x="391" y="762" font-size="22" font-weight="normal" fill="#172b36">800</text><text x="485" y="762" font-size="22" font-weight="normal" fill="#172b36">800</text><text x="80" y="821" font-size="24" font-weight="normal" fill="#172b36">1. El primer asiento reconoce el gasto y la obligación por 600.</text><text x="80" y="867" font-size="24" font-weight="normal" fill="#172b36">2. El segundo reduce la deuda y la caja por 200; no reconoce nuevamente el gasto.</text><text x="80" y="913" font-size="24" font-weight="normal" fill="#172b36">3. Mayor de Alquileres a pagar: Haber 600 − Debe 200 = saldo acreedor 400.</text><text x="80" y="959" font-size="24" font-weight="normal" fill="#172b36">4. Control de deuda: 600 − 200 = 400. El gasto reconocido continúa en 600.</text><text x="80" y="1025" font-size="25" font-weight="bold" fill="#103a4a">Resultado</text><text x="80" y="1071" font-size="24" font-weight="normal" fill="#172b36">Deuda restante: 400. Gasto reconocido: 600.</text></g></svg>