<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1048" viewBox="0 0 1800 1048"><title>ejercicio-01</title><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans Mono, monospace"><text x="35" y="48" font-size="26" fill="#103a4a">Unidad 5 propuesta — Ejercicio 1: Diario y saldo de Caja</text><text x="35" y="107" font-size="18" fill="#172b36">Ejemplo didáctico original, creado para estudiar; no es un enunciado de la profesora.</text><text x="35" y="157" font-size="26" fill="#103a4a">Enunciado</text><text x="35" y="216" font-size="18" fill="#172b36">Una empresa recibe un aporte en efectivo de 10.000; compra mercaderías al contado por 2.000 y cobra 1.500 por</text><text x="35" y="241" font-size="18" fill="#172b36">servicios prestados. Registrá las operaciones y calculá el saldo de Caja.</text><text x="35" y="291" font-size="26" fill="#103a4a">Datos y supuestos</text><text x="35" y="350" font-size="18" fill="#172b36">Empresa nueva; importes ilustrativos; sin impuestos, costos adicionales ni otros movimientos. Los servicios están</text><text x="35" y="375" font-size="18" fill="#172b36">devengados al cobrarse.</text><text x="35" y="425" font-size="26" fill="#103a4a">Resolución paso a paso</text><text x="35" y="484" font-size="18" fill="#172b36">| Operación y cuenta | Debe | Haber |</text><text x="35" y="509" font-size="18" fill="#172b36">| --- | ---: | ---: |</text><text x="35" y="534" font-size="18" fill="#172b36">| 1. Caja | 10.000 | — |</text><text x="35" y="559" font-size="18" fill="#172b36">| 1. Capital | — | 10.000 |</text><text x="35" y="584" font-size="18" fill="#172b36">| 2. Mercaderías | 2.000 | — |</text><text x="35" y="609" font-size="18" fill="#172b36">| 2. Caja | — | 2.000 |</text><text x="35" y="634" font-size="18" fill="#172b36">| 3. Caja | 1.500 | — |</text><text x="35" y="659" font-size="18" fill="#172b36">| 3. Ingresos por servicios | — | 1.500 |</text><text x="35" y="684" font-size="18" fill="#172b36">| Total de los tres asientos | 13.500 | 13.500 |</text><text x="35" y="734" font-size="18" fill="#172b36">1. Cada operación tiene Debe igual al Haber: 10.000, 2.000 y 1.500 respectivamente.</text><text x="35" y="759" font-size="18" fill="#172b36">2. Mayor de Caja: Debe 10.000 + 1.500 = 11.500; Haber 2.000. Saldo deudor: 9.500.</text><text x="35" y="784" font-size="18" fill="#172b36">3. Comprobación con resultados abiertos: Activo 11.500 + resultados negativos 0 = pasivo 0 + capital 10.000 +</text><text x="35" y="809" font-size="18" fill="#172b36">resultados positivos 1.500; ambos lados suman 11.500.</text><text x="35" y="834" font-size="18" fill="#172b36">4. Control patrimonial equivalente: Caja 9.500 + Mercaderías 2.000 = Activo 11.500. Sin pasivos, PN = capital 10.000</text><text x="35" y="859" font-size="18" fill="#172b36">+ resultado positivo 1.500 = 11.500.</text><text x="35" y="909" font-size="26" fill="#103a4a">Resultado</text><text x="35" y="968" font-size="18" fill="#172b36">Saldo de Caja: 9.500 deudor. Activo y patrimonio neto: 11.500.</text></g></svg>