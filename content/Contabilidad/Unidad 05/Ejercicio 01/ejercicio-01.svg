<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1251" viewBox="0 0 1600 1251"><title>ejercicio-01</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="80" y="66" font-size="30" font-weight="bold" fill="#103a4a">Unidad 5 propuesta — Ejercicio 1: Diario y saldo de Caja</text><text x="80" y="112" font-size="24" font-weight="normal" fill="#172b36">Ejemplo didáctico original, creado para estudiar; no es un enunciado de la profesora.</text><text x="80" y="178" font-size="25" font-weight="bold" fill="#103a4a">Enunciado</text><text x="80" y="224" font-size="24" font-weight="normal" fill="#172b36">Una empresa recibe un aporte en efectivo de 10.000; compra mercaderías al contado por 2.000 y cobra 1.500 por servicios prestados.</text><text x="80" y="258" font-size="24" font-weight="normal" fill="#172b36">Registrá las operaciones y calculá el saldo de Caja.</text><text x="80" y="324" font-size="25" font-weight="bold" fill="#103a4a">Datos y supuestos</text><text x="80" y="370" font-size="24" font-weight="normal" fill="#172b36">Empresa nueva; importes ilustrativos; sin impuestos, costos adicionales ni otros movimientos. Los servicios están devengados al</text><text x="80" y="404" font-size="24" font-weight="normal" fill="#172b36">cobrarse.</text><text x="80" y="470" font-size="25" font-weight="bold" fill="#103a4a">Resolución paso a paso</text><rect x="80" y="490" width="516.95" height="48" fill="#e7eff2"/><line x1="80" y1="538" x2="596.95" y2="538" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="522" font-size="22" font-weight="bold" fill="#172b36">Operación y cuenta</text><text x="393" y="522" font-size="22" font-weight="bold" fill="#172b36">Debe</text><text x="501" y="522" font-size="22" font-weight="bold" fill="#172b36">Haber</text><line x1="80" y1="586" x2="596.95" y2="586" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="570" font-size="22" font-weight="normal" fill="#172b36">1. Caja</text><text x="393" y="570" font-size="22" font-weight="normal" fill="#172b36">10.000</text><text x="501" y="570" font-size="22" font-weight="normal" fill="#172b36">—</text><line x1="80" y1="634" x2="596.95" y2="634" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="618" font-size="22" font-weight="normal" fill="#172b36">1. Capital</text><text x="393" y="618" font-size="22" font-weight="normal" fill="#172b36">—</text><text x="501" y="618" font-size="22" font-weight="normal" fill="#172b36">10.000</text><line x1="80" y1="682" x2="596.95" y2="682" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="666" font-size="22" font-weight="normal" fill="#172b36">2. Mercaderías</text><text x="393" y="666" font-size="22" font-weight="normal" fill="#172b36">2.000</text><text x="501" y="666" font-size="22" font-weight="normal" fill="#172b36">—</text><line x1="80" y1="730" x2="596.95" y2="730" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="714" font-size="22" font-weight="normal" fill="#172b36">2. Caja</text><text x="393" y="714" font-size="22" font-weight="normal" fill="#172b36">—</text><text x="501" y="714" font-size="22" font-weight="normal" fill="#172b36">2.000</text><line x1="80" y1="778" x2="596.95" y2="778" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="762" font-size="22" font-weight="normal" fill="#172b36">3. Caja</text><text x="393" y="762" font-size="22" font-weight="normal" fill="#172b36">1.500</text><text x="501" y="762" font-size="22" font-weight="normal" fill="#172b36">—</text><line x1="80" y1="826" x2="596.95" y2="826" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="810" font-size="22" font-weight="normal" fill="#172b36">3. Ingresos por servicios</text><text x="393" y="810" font-size="22" font-weight="normal" fill="#172b36">—</text><text x="501" y="810" font-size="22" font-weight="normal" fill="#172b36">1.500</text><line x1="80" y1="874" x2="596.95" y2="874" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="858" font-size="22" font-weight="normal" fill="#172b36">Total de los tres asientos</text><text x="393" y="858" font-size="22" font-weight="normal" fill="#172b36">13.500</text><text x="501" y="858" font-size="22" font-weight="normal" fill="#172b36">13.500</text><text x="80" y="917" font-size="24" font-weight="normal" fill="#172b36">1. Cada operación tiene Debe igual al Haber: 10.000, 2.000 y 1.500 respectivamente.</text><text x="80" y="963" font-size="24" font-weight="normal" fill="#172b36">2. Mayor de Caja: Debe 10.000 + 1.500 = 11.500; Haber 2.000. Saldo deudor: 9.500.</text><text x="80" y="1009" font-size="24" font-weight="normal" fill="#172b36">3. Control patrimonial: Caja 9.500 + Mercaderías 2.000 = Activo 11.500. Sin pasivos, PN = capital 10.000 + resultado positivo 1.500 =</text><text x="80" y="1043" font-size="24" font-weight="normal" fill="#172b36">11.500.</text><text x="80" y="1109" font-size="25" font-weight="bold" fill="#103a4a">Resultado</text><text x="80" y="1155" font-size="24" font-weight="normal" fill="#172b36">Saldo de Caja: 9.500 deudor. Activo y patrimonio neto: 11.500.</text></g></svg>