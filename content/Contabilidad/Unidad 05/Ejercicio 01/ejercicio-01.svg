<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="831" viewBox="0 0 1420 831"><title>ejercicio-01</title><rect width="100%" height="100%" fill="white"/><g font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><text x="40" y="93" font-size="30" font-weight="bold" fill="#103a4a">Unidad 5 — Ejercicio 1: Diario y saldo de Caja</text><text x="40" y="119" font-size="18" fill="#172b36">Ejemplo didáctico original, creado para estudiar; no es un enunciado de la profesora.</text><text x="40" y="173" font-size="24" font-weight="bold" fill="#103a4a">Enunciado</text><text x="40" y="199" font-size="18" fill="#172b36">Una empresa recibe un aporte en efectivo de $10.000; compra mercaderías al contado por $2.000 y cobra $1.500 en efectivo por servicios</text><text x="40" y="225" font-size="18" fill="#172b36">prestados. Registrá las operaciones y calculá el saldo de Caja.</text><text x="40" y="279" font-size="24" font-weight="bold" fill="#103a4a">Datos y supuestos</text><text x="40" y="305" font-size="18" fill="#172b36">Sin impuestos. Según el manual, los servicios prestados se registran en Ventas.</text><text x="40" y="359" font-size="24" font-weight="bold" fill="#103a4a">Resolución paso a paso</text><text x="40" y="385" font-size="18" font-weight="bold" fill="#172b36">Asiento │ Cuenta      │ Debe   │ Haber </text><text x="40" y="411" font-size="18" fill="#172b36">────────┼─────────────┼────────┼───────</text><text x="40" y="437" font-size="18" fill="#172b36">1       │ Caja        │ 10.000 │       </text><text x="40" y="463" font-size="18" fill="#172b36">        │ a Capital   │        │ 10.000</text><text x="40" y="489" font-size="18" fill="#172b36">2       │ Mercaderías │ 2.000  │       </text><text x="40" y="515" font-size="18" fill="#172b36">        │ a Caja      │        │ 2.000 </text><text x="40" y="541" font-size="18" fill="#172b36">3       │ Caja        │ 1.500  │       </text><text x="40" y="567" font-size="18" fill="#172b36">        │ a Ventas    │        │ 1.500 </text><text x="40" y="593" font-size="18" fill="#172b36">        │ Totales     │ 13.500 │ 13.500</text><text x="40" y="629" font-size="18" fill="#172b36">1. Mayor de Caja: Debe 10.000 + 1.500 = 11.500; Haber 2.000. Saldo deudor 9.500.</text><text x="40" y="665" font-size="18" fill="#172b36">2. Activo = Caja 9.500 + Mercaderías 2.000 = 11.500.</text><text x="40" y="701" font-size="18" fill="#172b36">3. Comprobación: Activo 11.500 + Resultados negativos 0 = Pasivo 0 + Capital 10.000 + Resultados positivos 1.500 → 11.500 = 11.500.</text><text x="40" y="755" font-size="24" font-weight="bold" fill="#103a4a">Resultado</text><text x="40" y="781" font-size="18" fill="#172b36">Saldo de Caja: 9.500 deudor. Patrimonio neto: 11.500.</text></g></svg>