<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="779" viewBox="0 0 1430 779"><title>ejercicio-03</title><rect width="100%" height="100%" fill="white"/><g font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><text x="40" y="93" font-size="30" font-weight="bold" fill="#103a4a">Unidad 3 — Ejercicio 3: Devengado y cobro</text><text x="40" y="119" font-size="18" fill="#172b36">Ejemplo didáctico original, creado para estudiar; no es un enunciado de la profesora.</text><text x="40" y="173" font-size="24" font-weight="bold" fill="#103a4a">Enunciado</text><text x="40" y="199" font-size="18" fill="#172b36">Un servicio por $3.000 se presta en diciembre y se cobra en enero. Registrá según la base devengado y explicá qué cambiaría con la base</text><text x="40" y="225" font-size="18" fill="#172b36">percibido.</text><text x="40" y="279" font-size="24" font-weight="bold" fill="#103a4a">Datos y supuestos</text><text x="40" y="305" font-size="18" fill="#172b36">Sin impuestos. Según el manual, los servicios prestados se registran en Ventas y el crédito en Deudores por ventas.</text><text x="40" y="359" font-size="24" font-weight="bold" fill="#103a4a">Resolución paso a paso</text><text x="40" y="385" font-size="18" font-weight="bold" fill="#172b36">Fecha     │ Cuenta                │ Debe  │ Haber</text><text x="40" y="411" font-size="18" fill="#172b36">──────────┼───────────────────────┼───────┼──────</text><text x="40" y="437" font-size="18" fill="#172b36">Diciembre │ Deudores por ventas   │ 3.000 │      </text><text x="40" y="463" font-size="18" fill="#172b36">          │ a Ventas              │       │ 3.000</text><text x="40" y="489" font-size="18" fill="#172b36">Enero     │ Caja                  │ 3.000 │      </text><text x="40" y="515" font-size="18" fill="#172b36">          │ a Deudores por ventas │       │ 3.000</text><text x="40" y="551" font-size="18" fill="#172b36">1. Diciembre (devengado): el servicio ya se prestó: se reconoce la ganancia y el derecho a cobrar. Es una variación modificativa</text><text x="40" y="577" font-size="18" fill="#172b36">  aumentativa.</text><text x="40" y="613" font-size="18" fill="#172b36">2. Enero: el cobro cambia un activo por otro (permutativa). No se vuelve a registrar la venta.</text><text x="40" y="649" font-size="18" fill="#172b36">3. Base percibido: el ingreso se registraría recién en enero, al cobrar. La contabilidad en Argentina usa la base devengado.</text><text x="40" y="703" font-size="24" font-weight="bold" fill="#103a4a">Resultado</text><text x="40" y="729" font-size="18" fill="#172b36">El ingreso corresponde a diciembre; en enero solo hay un cobro.</text></g></svg>