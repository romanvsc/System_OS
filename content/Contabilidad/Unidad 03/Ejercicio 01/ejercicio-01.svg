<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="597" viewBox="0 0 1070 597"><title>ejercicio-01</title><rect width="100%" height="100%" fill="white"/><g font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><text x="40" y="93" font-size="30" font-weight="bold" fill="#103a4a">Unidad 3 — Ejercicio 1: Calcular patrimonio neto</text><text x="40" y="119" font-size="18" fill="#172b36">Ejemplo didáctico original, creado para estudiar; no es un enunciado de la profesora.</text><text x="40" y="173" font-size="24" font-weight="bold" fill="#103a4a">Enunciado</text><text x="40" y="199" font-size="18" fill="#172b36">En una fecha, una empresa tiene activos por 12.000 y pasivos por 5.000. Calculá el patrimonio neto.</text><text x="40" y="253" font-size="24" font-weight="bold" fill="#103a4a">Datos y supuestos</text><text x="40" y="279" font-size="18" fill="#172b36">Importes ilustrativos de un mismo momento.</text><text x="40" y="333" font-size="24" font-weight="bold" fill="#103a4a">Resolución paso a paso</text><text x="40" y="359" font-size="18" fill="#172b36">1. Usamos la igualdad: Activo = Pasivo + Patrimonio neto.</text><text x="40" y="395" font-size="18" fill="#172b36">2. Despejamos: Patrimonio neto = Activo − Pasivo.</text><text x="40" y="431" font-size="18" fill="#172b36">3. Cálculo: 12.000 − 5.000 = 7.000.</text><text x="40" y="467" font-size="18" fill="#172b36">4. Control: 5.000 + 7.000 = 12.000.</text><text x="40" y="521" font-size="24" font-weight="bold" fill="#103a4a">Resultado</text><text x="40" y="547" font-size="18" fill="#172b36">Patrimonio neto: 7.000.</text></g></svg>