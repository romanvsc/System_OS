<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="794" viewBox="0 0 1600 794"><title>ejercicio-01</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="80" y="66" font-size="30" font-weight="bold" fill="#103a4a">Unidad 3 propuesta — Ejercicio 1: Calcular patrimonio neto</text><text x="80" y="112" font-size="24" font-weight="normal" fill="#172b36">Ejemplo didáctico original, creado para estudiar; no es un enunciado de la profesora.</text><text x="80" y="178" font-size="25" font-weight="bold" fill="#103a4a">Enunciado</text><text x="80" y="224" font-size="24" font-weight="normal" fill="#172b36">En una fecha, una empresa tiene activos por 12.000 y pasivos por 5.000. Calculá el patrimonio neto.</text><text x="80" y="290" font-size="25" font-weight="bold" fill="#103a4a">Datos y supuestos</text><text x="80" y="336" font-size="24" font-weight="normal" fill="#172b36">Importes ilustrativos de un mismo momento.</text><text x="80" y="402" font-size="25" font-weight="bold" fill="#103a4a">Resolución paso a paso</text><text x="80" y="448" font-size="24" font-weight="normal" fill="#172b36">1. Usamos la igualdad: Activo = Pasivo + Patrimonio neto.</text><text x="80" y="494" font-size="24" font-weight="normal" fill="#172b36">2. Despejamos: Patrimonio neto = Activo − Pasivo.</text><text x="80" y="540" font-size="24" font-weight="normal" fill="#172b36">3. Cálculo: 12.000 − 5.000 = 7.000.</text><text x="80" y="586" font-size="24" font-weight="normal" fill="#172b36">4. Control: 5.000 + 7.000 = 12.000.</text><text x="80" y="652" font-size="25" font-weight="bold" fill="#103a4a">Resultado</text><text x="80" y="698" font-size="24" font-weight="normal" fill="#172b36">Patrimonio neto: 7.000.</text></g></svg>