<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1003" viewBox="0 0 1600 1003"><title>ejercicio-02</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="80" y="66" font-size="30" font-weight="bold" fill="#103a4a">Unidad 4 propuesta — Ejercicio 2: Cuenta T de Caja</text><text x="80" y="112" font-size="24" font-weight="normal" fill="#172b36">Ejemplo didáctico original, creado para estudiar; no es un enunciado de la profesora.</text><text x="80" y="178" font-size="25" font-weight="bold" fill="#103a4a">Enunciado</text><text x="80" y="224" font-size="24" font-weight="normal" fill="#172b36">Caja comienza con 5.000 en el Debe, recibe 2.000 y paga 1.800. Elaborá la cuenta y calculá su saldo.</text><text x="80" y="290" font-size="25" font-weight="bold" fill="#103a4a">Datos y supuestos</text><text x="80" y="336" font-size="24" font-weight="normal" fill="#172b36">Importes ilustrativos; los movimientos se refieren a la misma cuenta.</text><text x="80" y="402" font-size="25" font-weight="bold" fill="#103a4a">Resolución paso a paso</text><rect x="80" y="422" width="395.00" height="48" fill="#e7eff2"/><line x1="80" y1="470" x2="475.00" y2="470" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="454" font-size="22" font-weight="bold" fill="#172b36">Caja: Debe</text><text x="319" y="454" font-size="22" font-weight="bold" fill="#172b36">Caja: Haber</text><line x1="80" y1="518" x2="475.00" y2="518" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="502" font-size="22" font-weight="normal" fill="#172b36">Saldo inicial 5.000</text><text x="319" y="502" font-size="22" font-weight="normal" fill="#172b36">Pago 1.800</text><line x1="80" y1="566" x2="475.00" y2="566" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="550" font-size="22" font-weight="normal" fill="#172b36">Cobro 2.000</text><text x="319" y="550" font-size="22" font-weight="normal" fill="#172b36">—</text><line x1="80" y1="614" x2="475.00" y2="614" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="598" font-size="22" font-weight="normal" fill="#172b36">Total 7.000</text><text x="319" y="598" font-size="22" font-weight="normal" fill="#172b36">Total 1.800</text><text x="80" y="657" font-size="24" font-weight="normal" fill="#172b36">1. Total Debe: 5.000 + 2.000 = 7.000.</text><text x="80" y="703" font-size="24" font-weight="normal" fill="#172b36">2. Total Haber: 1.800.</text><text x="80" y="749" font-size="24" font-weight="normal" fill="#172b36">3. Saldo: 7.000 − 1.800 = 5.200. Como el Debe es mayor, es saldo deudor.</text><text x="80" y="795" font-size="24" font-weight="normal" fill="#172b36">4. Control: 1.800 + 5.200 = 7.000.</text><text x="80" y="861" font-size="25" font-weight="bold" fill="#103a4a">Resultado</text><text x="80" y="907" font-size="24" font-weight="normal" fill="#172b36">Caja tiene saldo deudor de 5.200.</text></g></svg>