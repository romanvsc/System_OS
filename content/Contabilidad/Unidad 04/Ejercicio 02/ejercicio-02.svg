<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="737" viewBox="0 0 1080 737"><title>ejercicio-02</title><rect width="100%" height="100%" fill="white"/><g font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><text x="40" y="93" font-size="30" font-weight="bold" fill="#103a4a">Unidad 4 — Ejercicio 2: Cuenta T de Caja</text><text x="40" y="119" font-size="18" fill="#172b36">Ejemplo didáctico original, creado para estudiar; no es un enunciado de la profesora.</text><text x="40" y="173" font-size="24" font-weight="bold" fill="#103a4a">Enunciado</text><text x="40" y="199" font-size="18" fill="#172b36">Caja comienza con 5.000 en el Debe, recibe 2.000 y paga 1.800. Elaborá la cuenta y calculá su saldo.</text><text x="40" y="253" font-size="24" font-weight="bold" fill="#103a4a">Datos y supuestos</text><text x="40" y="279" font-size="18" fill="#172b36">Importes ilustrativos; los movimientos se refieren a la misma cuenta.</text><text x="40" y="333" font-size="24" font-weight="bold" fill="#103a4a">Resolución paso a paso</text><text x="40" y="359" font-size="18" font-weight="bold" fill="#172b36">Caja: Debe          │ Caja: Haber</text><text x="40" y="385" font-size="18" fill="#172b36">────────────────────┼────────────</text><text x="40" y="411" font-size="18" fill="#172b36">Saldo inicial 5.000 │ Pago 1.800 </text><text x="40" y="437" font-size="18" fill="#172b36">Cobro 2.000         │ —          </text><text x="40" y="463" font-size="18" fill="#172b36">Total 7.000         │ Total 1.800</text><text x="40" y="499" font-size="18" fill="#172b36">1. Total Debe: 5.000 + 2.000 = 7.000.</text><text x="40" y="535" font-size="18" fill="#172b36">2. Total Haber: 1.800.</text><text x="40" y="571" font-size="18" fill="#172b36">3. Saldo: 7.000 − 1.800 = 5.200. Como el Debe es mayor, es saldo deudor.</text><text x="40" y="607" font-size="18" fill="#172b36">4. Control: 1.800 + 5.200 = 7.000.</text><text x="40" y="661" font-size="24" font-weight="bold" fill="#103a4a">Resultado</text><text x="40" y="687" font-size="18" fill="#172b36">Caja tiene saldo deudor de 5.200.</text></g></svg>