<svg xmlns="http://www.w3.org/2000/svg" width="1470" height="649" viewBox="0 0 1470 649"><title>ejercicio-03</title><rect width="100%" height="100%" fill="white"/><g font-family="Consolas, DejaVu Sans Mono, monospace" xml:space="preserve"><text x="40" y="93" font-size="30" font-weight="bold" fill="#103a4a">Unidad 4 — Ejercicio 3: Cuenta regularizadora</text><text x="40" y="119" font-size="18" fill="#172b36">Ejemplo didáctico original, creado para estudiar; no es un enunciado de la profesora.</text><text x="40" y="173" font-size="24" font-weight="bold" fill="#103a4a">Enunciado</text><text x="40" y="199" font-size="18" fill="#172b36">Una empresa presenta créditos por 10.000 y una previsión para incobrables de 400 relacionada con esos créditos. Calculá el importe neto</text><text x="40" y="225" font-size="18" fill="#172b36">presentado en este ejemplo.</text><text x="40" y="279" font-size="24" font-weight="bold" fill="#103a4a">Datos y supuestos</text><text x="40" y="305" font-size="18" fill="#172b36">Se supone didácticamente que la previsión reduce la exposición del crédito y que los importes ya fueron determinados; no se calcula ninguna</text><text x="40" y="331" font-size="18" fill="#172b36">tasa.</text><text x="40" y="385" font-size="24" font-weight="bold" fill="#103a4a">Resolución paso a paso</text><text x="40" y="411" font-size="18" fill="#172b36">1. Importe bruto de créditos: 10.000.</text><text x="40" y="447" font-size="18" fill="#172b36">2. Menos cuenta regularizadora vinculada: 400.</text><text x="40" y="483" font-size="18" fill="#172b36">3. Importe neto: 10.000 − 400 = 9.600.</text><text x="40" y="519" font-size="18" fill="#172b36">4. La previsión se analiza junto con los créditos; no es una deuda nueva con clientes en este ejemplo.</text><text x="40" y="573" font-size="24" font-weight="bold" fill="#103a4a">Resultado</text><text x="40" y="599" font-size="18" fill="#172b36">Créditos netos del ejemplo: 9.600.</text></g></svg>