<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="862" viewBox="0 0 1600 862"><title>ejercicio-03</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="80" y="66" font-size="30" font-weight="bold" fill="#103a4a">Unidad 4 propuesta — Ejercicio 3: Cuenta regularizadora</text><text x="80" y="112" font-size="24" font-weight="normal" fill="#172b36">Ejemplo didáctico original, creado para estudiar; no es un enunciado de la profesora.</text><text x="80" y="178" font-size="25" font-weight="bold" fill="#103a4a">Enunciado</text><text x="80" y="224" font-size="24" font-weight="normal" fill="#172b36">Una empresa presenta créditos por 10.000 y una previsión para incobrables de 400 relacionada con esos créditos. Calculá el importe</text><text x="80" y="258" font-size="24" font-weight="normal" fill="#172b36">neto presentado en este ejemplo.</text><text x="80" y="324" font-size="25" font-weight="bold" fill="#103a4a">Datos y supuestos</text><text x="80" y="370" font-size="24" font-weight="normal" fill="#172b36">Se supone didácticamente que la previsión reduce la exposición del crédito y que los importes ya fueron determinados; no se calcula</text><text x="80" y="404" font-size="24" font-weight="normal" fill="#172b36">ninguna tasa.</text><text x="80" y="470" font-size="25" font-weight="bold" fill="#103a4a">Resolución paso a paso</text><text x="80" y="516" font-size="24" font-weight="normal" fill="#172b36">1. Importe bruto de créditos: 10.000.</text><text x="80" y="562" font-size="24" font-weight="normal" fill="#172b36">2. Menos cuenta regularizadora vinculada: 400.</text><text x="80" y="608" font-size="24" font-weight="normal" fill="#172b36">3. Importe neto: 10.000 − 400 = 9.600.</text><text x="80" y="654" font-size="24" font-weight="normal" fill="#172b36">4. La previsión se analiza junto con los créditos; no es una deuda nueva con clientes en este ejemplo.</text><text x="80" y="720" font-size="25" font-weight="bold" fill="#103a4a">Resultado</text><text x="80" y="766" font-size="24" font-weight="normal" fill="#172b36">Créditos netos del ejemplo: 9.600.</text></g></svg>