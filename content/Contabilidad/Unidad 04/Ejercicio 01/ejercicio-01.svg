<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1043" viewBox="0 0 1600 1043"><title>ejercicio-01</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="80" y="66" font-size="30" font-weight="bold" fill="#103a4a">Unidad 4 propuesta — Ejercicio 1: Clasificar cuentas</text><text x="80" y="112" font-size="24" font-weight="normal" fill="#172b36">Ejemplo didáctico original, creado para estudiar; no es un enunciado de la profesora.</text><text x="80" y="178" font-size="25" font-weight="bold" fill="#103a4a">Enunciado</text><text x="80" y="224" font-size="24" font-weight="normal" fill="#172b36">Clasificá estas cuentas en un esquema básico: Caja, Mercaderías, Proveedores, Capital, Ventas y Alquileres perdidos.</text><text x="80" y="290" font-size="25" font-weight="bold" fill="#103a4a">Datos y supuestos</text><text x="80" y="336" font-size="24" font-weight="normal" fill="#172b36">Se supone que Ventas representa ingresos y Alquileres perdidos un gasto. La denominación exacta de las cuentas puede variar según</text><text x="80" y="370" font-size="24" font-weight="normal" fill="#172b36">el plan de clase.</text><text x="80" y="436" font-size="25" font-weight="bold" fill="#103a4a">Resolución paso a paso</text><rect x="80" y="456" width="532.00" height="48" fill="#e7eff2"/><line x1="80" y1="504" x2="612.00" y2="504" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="488" font-size="22" font-weight="bold" fill="#172b36">Cuenta</text><text x="328" y="488" font-size="22" font-weight="bold" fill="#172b36">Clasificación supuesta</text><line x1="80" y1="552" x2="612.00" y2="552" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="536" font-size="22" font-weight="normal" fill="#172b36">Caja</text><text x="328" y="536" font-size="22" font-weight="normal" fill="#172b36">Activo</text><line x1="80" y1="600" x2="612.00" y2="600" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="584" font-size="22" font-weight="normal" fill="#172b36">Mercaderías</text><text x="328" y="584" font-size="22" font-weight="normal" fill="#172b36">Activo</text><line x1="80" y1="648" x2="612.00" y2="648" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="632" font-size="22" font-weight="normal" fill="#172b36">Proveedores</text><text x="328" y="632" font-size="22" font-weight="normal" fill="#172b36">Pasivo</text><line x1="80" y1="696" x2="612.00" y2="696" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="680" font-size="22" font-weight="normal" fill="#172b36">Capital</text><text x="328" y="680" font-size="22" font-weight="normal" fill="#172b36">Patrimonio neto</text><line x1="80" y1="744" x2="612.00" y2="744" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="728" font-size="22" font-weight="normal" fill="#172b36">Ventas</text><text x="328" y="728" font-size="22" font-weight="normal" fill="#172b36">Resultado positivo</text><line x1="80" y1="792" x2="612.00" y2="792" stroke="#9aaeb5" stroke-width="1"/><text x="92" y="776" font-size="22" font-weight="normal" fill="#172b36">Alquileres perdidos</text><text x="328" y="776" font-size="22" font-weight="normal" fill="#172b36">Resultado negativo</text><text x="80" y="835" font-size="24" font-weight="normal" fill="#172b36">La clasificación depende del contenido y de cómo se use cada cuenta en el caso.</text><text x="80" y="901" font-size="25" font-weight="bold" fill="#103a4a">Resultado</text><text x="80" y="947" font-size="24" font-weight="normal" fill="#172b36">Dos cuentas de activo, una de pasivo, una de patrimonio neto y dos de resultados.</text></g></svg>